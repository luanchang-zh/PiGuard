listener 1883 127.0.0.1
protocol mqtt
listener 1884 127.0.0.1
protocol websockets
socket_domain ipv4
allow_anonymous false
password_file /etc/piguard/mqtt-auth/passwords
acl_file /etc/piguard/mqtt-auth/acl
persistence true
persistence_location /var/lib/piguard-mqtt/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
