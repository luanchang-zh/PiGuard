acceptance:
  - id: A1
    source: brief.md
    text: A1：四类合法请求通过校验。在线且 Broker 可用的设备收到请求后，HTTP 202/code 0 返回 command_id 和
      pending；数据库已存在唯一记录。MQTT 下发含 schema_version=1、同一 ID/设备、类型、参数及 UTC
      签发/到期时间，QoS 1、retained=false。
    result: passed
    reason:
      text: protocol严格校验四类参数；Create生成唯一cmd
        ID和UTC时间、expires_at=issued_at+10秒，先插入pending再入异步队列。handler固定返回202/code0/pending；命令发送QoS1、retained=false。TestCommandsHTTPAndTwoWebsockets覆盖四类请求及重复有效POST生成新ID，Runtime
        test/race通过。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：非法 JSON、缺失/越界参数、未知或本轮不支持的类型返回 HTTP 400/40001；未知设备返回 404/40401；未知
      command_id 返回 404/40402。上述无效创建请求不入库、不发布。
    result: passed
    reason:
      text: 单对象解码拒绝非法JSON、额外字段、尾随JSON、null/缺失/错误类型/越界参数及未支持类型。HTTP错误映射为400/40001、404/40401、404/40402。协议和HTTP拒绝测试通过，并断言无效创建请求的commands记录数为0；拒绝路径不调用发布。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：已知离线设备返回 HTTP 503/50301；设备在线但 Broker 不可用返回
      503/50302。两种前置拒绝均不创建命令或发布。受理后发布明确失败写 failed，发布结果不确定时保留待决并最终超时；不得宣称设备执行成功。
    result: passed
    reason:
      text: 创建前检查登记、在线事实、工作过程及发布可用性；离线和发布不可用映射50301/50302且不入库。明确未提交错误仅将仍pending记录改failed/MQTT_UNAVAILABLE；token错误、等待超时或取消保持交付不确定，不伪造执行失败。HTTP拒绝与发送结果/截止测试通过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：单独收到 Broker publish 成功，GET 与 WS 显示 sent；合法 success Ack 才写 success 和
      result，合法 failed Ack 写 failed 和设备 error，两类都保留执行时间和平台接收时间。
    result: passed
    reason:
      text: publish成功仅条件转换pending→sent；success/设备failed由合法Ack转换并分别保存结构化result/error、平台ack_at和设备executed_at。状态转换持久成功后发布统一WS更新。服务发送结果、快速Ack及HTTP模拟失败/成功测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：Ack 早于 publish 完成时仍可从 pending 进入终态；随后 publish 完成不能覆盖回 sent。重复相同 Ack、冲突
      Ack 不重复改变终态/广播；非法版本、主题身份不符、未知命令或跨设备 Ack 不更新记录。
    result: passed
    reason:
      text: Ack可直接结束pending，发送完成重新读取当前记录且不能覆盖终态；仓储转换包含当前状态条件。非法版本/主题身份/未知命令/跨设备Ack拒绝且不广播。快速Ack、并发冲突及八个诊断场景通过；相同Ack分类duplicate，结果/错误/时间/状态差异分类conflict，均保留首个终态且不重复广播。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：在签发后 10 秒截止前未收到有效 Ack，pending 和 sent 均变为 timeout；迟到 Ack
      不改终态，只留诊断。timeout 表示未及时确认，不宣称设备一定没有执行。边界时间采用平台接收有效 Ack 的时间，不信任设备时钟决定超时。
    result: passed
    reason:
      text: 统一10秒截止；Ack接收与截止处理在同一临界区排序，received_at取平台时间，等于或晚于expires_at不能写Ack终态。100ms扫描和GET读取前持久超时覆盖pending/sent。截止边界与两个迟到路径测试通过，日志保留Ack状态、executed_at、received_at和expires_at；迟到Ack不改变终态或结果。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：平台重启后保留已结束命令；从数据库恢复 pending/sent，已过截止时间变 timeout，未到期继续等待
      Ack；不自动重新发布动作。Broker 重连后可继续接收新命令的 Ack。
    result: passed
    reason:
      text: Start从数据库扫描过期pending/sent并转timeout；未到期记录继续等待Ack，既有终态保留，恢复不向发送队列重放。TestCommandRecoveryNeverReplays覆盖manager重建及无发布。Subscriber首次订阅失败可见，OnConnect恢复三个主题；软件客户端重连订阅测试通过。实际Broker/平台进程生命周期仍属明确延期边界。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：GET 返回
      command_id/device_id/type/params/status/issued_at/expires_at/ack_at/executed_at/result/error；没有
      Ack 时 ack_at/executed_at 为 null。WS command_update 使用统一 type/timestamp/data
      信封，状态来自同一持久记录；两个客户端可见更新，慢或断开连接不阻塞命令或遥测链路。
    result: passed
    reason:
      text: GET使用明确CommandView包含全部规定字段，无Ack及无结果/错误输出null；WS通过统一type/timestamp/data信封发送同一持久记录DTO。HTTP双WS测试比较同ID、类型、参数和结果；共享Hub的有界队列、慢客户端驱逐及WS关闭回归通过，命令发布等待位于Monitor锁外。
      truncated: false
  - id: A9
    source: brief.md
    text: A9：模拟器订阅 commands，提供成功、设备失败、不回执三种模式，按 command_id 缓存结果；重复命令只重发同一
      Ack，不再次执行，已过 expires_at 的新动作不执行。软件组件联调核对 HTTP/模拟发布器/模拟设备执行器/GET/双 WS 的同一
      ID 及成功、失败、超时和持久恢复行为。
    result: passed
    reason:
      text: 模拟器commands订阅调用实际CommandExecutor，提供success/failed/none模式，验证身份、类型参数及截止；按ID缓存Ack或无Ack结果，重复投递不再执行，过期新命令返回COMMAND_EXPIRED且执行计数不增。软件组件测试串联HTTP→模拟发布器→实际执行器→Ack→SQLite/GET/双WS，覆盖四类成功及失败/无Ack超时；服务层补充持久恢复和异常Ack/竞争边界，均由Runtime执行通过。
      truncated: false
  - id: A10
    source: brief.md
    text: A10：必要的 `go test -count=1 ./...`、`go test -race -count=1 ./...`、`go vet
      ./...` 通过；既有单元与组件层的监控排序、TTL、1Hz 历史和双 WS 行为保持通过。按用户最新约束，本轮不启动
      Docker、不做硬件测试，真实 Mosquitto 和实际 Broker/平台进程生命周期检查留待后续且明确标为未执行，不算通过。
    result: passed
    reason:
      text: 当前候选绑定的Runtime
        go-tests、go-race-supported-toolchain、go-vet均passed且exit_code=0；已读取对应日志核实相关包通过。正式命令包含-count=1和全包范围，race使用兼容Windows便携工具链。监控排序、TTL、每设备1Hz历史、并发、双WS及慢客户端回归包含在本次通过的软件检查中；integration标签的真实环境测试未执行。
      truncated: false
