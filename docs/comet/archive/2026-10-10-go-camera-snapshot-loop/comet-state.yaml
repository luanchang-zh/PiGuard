acceptance:
  - id: A1
    source: brief.md
    text: A1：HTTP 与 MQTT 解析支持 camera.snapshot，quality 省略为 80，显式整数 1—100
      接受；null、非整数、越界、未知字段和非对象拒绝，保存及下发参数一致；其他命令的严格校验保留。
    result: passed
    reason:
      text: HTTP/MQTT共用校验及NormalizedParams支持拍照，缺省80、显式整数1至100、null/非对象/未知字段拒绝，持久化/下发一致，其他四类保留。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：拍照命令复用受理、持久化、QoS 1 非 retained 下发及 10
      秒截止；未知/离线设备、不可用发布器和参数错误仍在发布前拒绝，重启不自动重发。
    result: passed
    reason:
      text: 复用CommandManager前置拒绝、先存pending后有界异步QoS1非retained下发、10秒截止和202；启动恢复截止，不重发。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：拍照成功 Ack 只有同设备、已提交的 snapshot 类型图片且文件可读才结束命令；未知、跨设备、错误类型、缺文件或非法 result
      不写成功、不广播，不把数据库/读取错误当有效图片。
    result: passed
    reason:
      text: 严格snapshot_id结果经ResolveSnapshot查已提交同设备snapshot、受限路径普通文件；错误不成功/广播，I/O后重查状态和截止。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：GET 与 command_update 的成功结果含 snapshot_id 和同一稳定 content
      URL；保留原设备回执用于重复判断；首个终态、重复/冲突/迟到回执、失败和超时规则不变，已上传图片不因超时回滚。
    result: passed
    reason:
      text: GET/WS共用DTO派生同稳定URL，DB保留原Ack作重复判断；条件更新保留首终态与失败/重复/冲突/迟到规则，超时不删图。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：模拟器成功模式按 quality 生成 JPEG，通过既有 multipart API 上传 snapshot 后发含服务端 ID 的
      Ack；命令重投递使用缓存结果不再次拍照或上传，过期命令不执行，上传故障给失败回执，none/failed 模式保留。
    result: passed
    reason:
      text: 按quality编码JPEG并multipart上传snapshot，验证201/200、code、设备/类型/时间/ID后Ack；缓存防重复，过期不执行，上传失败码及failed/none保留。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：模拟器上传有截止及取消约束，HTTP I/O 不在 MQTT 回调或 Monitor
      锁中等待；仍能继续遥测/配置处理，关停取消并收回拍照工作过程；重试使用同一 frame_id、时间和字节，不无限重试。
    result: passed
    reason:
      text: 回调只入有界队列，独立workerHTTP，进程ctx/命令deadline/6秒HTTP及最多3次同正文重试；关停取消并等待workers，遥测/配置独立。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：变更 Go 文件经过 gofmt，go build ./... 可编译；README/协议/完整 Spec
      一致并明确代码交付与未执行运行验收，保留延期验证清单及既有测试。 以上仅为代码交付验收，编译和独立代码核对不表示运行链路通过。
    result: passed
    reason:
      text: 第16节支持清单及config独立说明已修复，camera文档/README/完整Spec一致并明确延期。Go文件未改，复用上一候选实际Runtime
