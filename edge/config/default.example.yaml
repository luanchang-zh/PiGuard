# 设计示例：配置加载器、python -m piguard_edge、四条本地规则、四种下行命令和车道检测已实现。
# 所有相对路径均相对于本配置文件目录；真实凭据用本地覆盖/环境变量。
device:
  id: car-001
  mode: mock
  config_version: 0

mqtt:
  host: 127.0.0.1
  port: 1883
  client_id: piguard-edge-car-001
  keepalive_s: 30
  telemetry_qos: 0
  event_qos: 1
  status_qos: 1
  command_qos: 1
  ack_qos: 1
  status_heartbeat_s: 10
  username: ""
  password: ""

http:
  base_url: http://127.0.0.1:8080/api/v1
  timeout_s: 3
  # 设备 HTTP 身份，与 MQTT 密码独立。真实密码只放 config/local.yaml。
  # 填写后启用后台事件入库确认；平台账号不应部署到设备。
  username: ""
  password: ""

sensors:
  distance:
    driver: mock
    sample_hz: 10
  gyro:
    driver: mock
    sample_hz: 50
  temperature:
    driver: mock
    sample_hz: 1
  camera:
    driver: synthetic
    # 实际摄像头：参见 raspberrypi-demo.yaml 的 remote 配置和 USB 部署文档。
    capture_fps: 10
    process_fps: 5
    width: 640
    height: 480
    video_path: ""

speed:
  driver: scenario
  sample_hz: 10

simulation:
  scenario: normal_drive
  playback_speed: 1.0

mapping:
  # 桌面 HC-SR04 演示用 100。传感器直接测量车距时改为 1。处理层只乘这一次。
  distance_scale: 100

runtime:
  rule_hz: 10
  telemetry_hz: 2
  ttl_ms:
    speed: 1000
    distance: 1000
    gyro: 1000
    lane: 1000
    temperature: 5000

rules:
  obstacle:
    warning_distance_m: 15
    danger_distance_m: 8
    headway_enabled: true
    warning_headway_s: 1.5
    danger_headway_s: 0.8
  lane_departure:
    offset_threshold: 0.35
    duration_ms: 1000
  sharp_turn:
    yaw_threshold_deg_s: 30
    min_speed_kmh: 20
    duration_ms: 300
  temperature:
    trigger_c: 35
    recover_c: 33
    duration_ms: 5000
    recover_duration_ms: 5000

actuators:
  driver: mock

storage:
  sqlite_path: ../data/edge.db
  event_confirmation: http_query
  # 只回收已由平台查询确认的事件；未确认事件不按这个时间自动删除。
  confirmed_event_retention_days: 7

features:
  # 软件闭环已实现；在 local.yaml 中按需启用并填写设备 HTTP 凭据。
  remote_config: false
  frame_upload: false

# 实机接线。P1 起由加载器接受本段；mock 驱动不读取它。
# 地址使用十进制：MPU6050 0x68=104，AHT20 0x38=56，BMP280 0x76=118。
# 蜂鸣器与 LED 型号未定，这里不出现它们的引脚。
hardware:
  i2c_bus: 1
  distance:
    trigger_bcm: 23
    echo_bcm: 24
    max_distance_m: 4.0
    pulse_timeout_ms: 30
  gyro:
    address: 104
    yaw_axis: z
    yaw_sign: 1
    full_scale_dps: 500
  temperature:
    aht20_address: 56
    bmp280_address: 118
  camera:
    width: 640
    height: 480
