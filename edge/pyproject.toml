[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piguard-edge"
version = "0.0.0"
description = "PiGuard Raspberry Pi edge application scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["piguard_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["src"]
